name: Bug report
description: Something in the app isn't working the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Chats
        2. Tap …
        3. …
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iPhone
        - iPad
        - Mac
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version
      placeholder: iOS 26.1 / macOS 26.1
  - type: input
    id: app
    attributes:
      label: Pangea version
      description: Settings → About
      placeholder: 2.7.11 (1)
  - type: input
    id: radio
    attributes:
      label: Radio model and firmware
      placeholder: RAK4631, firmware 2.6.11
  - type: dropdown
    id: expert
    attributes:
      label: Expert Mode
      options:
        - "Off"
        - "On"
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here if they help.
